server:
  host: "127.0.0.1"
  port: 8000
  refresh_seconds: 10

display:
  title: "MBTA Transit Departures"
  clock_format_24h: false
  max_predictions_per_direction: 3
  show_alerts: true
  primary_text_scale: 1.0

routes:
  # Subway Example: Red Line
  - id: "red_line"
    type: "subway"
    route_id: "Red"
    stop_id: "place-dwnxg"
    name: "Downtown Crossing - Red Line"
    directions:
      - direction_id: 1
        headsign: "Alewife (Northbound)"
      - direction_id: 0
        headsign: "Ashmont / Braintree (Southbound)"

  # Commuter Rail Example: Fitchburg Line at North Station
  - id: "fitchburg_line"
    type: "commuter_rail"
    route_id: "CR-Fitchburg"
    stop_id: "place-north"
    name: "North Station - Fitchburg Line"
    directions:
      - direction_id: 0
        headsign: "Fitchburg (Outbound)"
      - direction_id: 1
        headsign: "North Station (Inbound)"

  # Bus Example: target-specific live ETAs
  - id: "local_buses"
    type: "bus"
    stop_id: "place-andrw"
    name: "Local Buses"
    bus_targets:
      - route_id: "10"
        route_name: "10"
        stop_id: "place-andrw"
        stop_name: "Andrew"
        direction_id: 0
        direction_name: "Outbound"
      - route_id: "10"
        route_name: "10"
        stop_id: "place-andrw"
        stop_name: "Andrew"
        direction_id: 1
        direction_name: "Inbound"
      - route_id: "708"
        route_name: "CT3"
        stop_id: "place-andrw"
        stop_name: "Andrew"
        direction_id: 0
        direction_name: "Outbound"

# Stations of interest for the physical transit display (Phase 2+).
# These are independent of the web dashboard `routes` above and are cycled
# through with the physical buttons via the StationManager. Uses the same
# fields as a route. If this section is omitted, the StationManager falls back
# to a built-in default list (Fenway, Kenmore, Longwood on the Green Line D).
stations:
  - id: "fenway_green_d"
    type: "subway"
    route_id: "Green-D"
    stop_id: "place-fenwy"
    name: "Fenway - Green Line (D)"
    directions:
      - direction_id: 1
        headsign: "Union Square (Inbound)"
      - direction_id: 0
        headsign: "Riverside (Outbound)"

  - id: "kenmore_green_d"
    type: "subway"
    route_id: "Green-D"
    stop_id: "place-kencl"
    name: "Kenmore - Green Line (D)"
    directions:
      - direction_id: 1
        headsign: "Union Square (Inbound)"
      - direction_id: 0
        headsign: "Riverside (Outbound)"

  - id: "longwood_green_d"
    type: "subway"
    route_id: "Green-D"
    stop_id: "place-longw"
    name: "Longwood - Green Line (D)"
    directions:
      - direction_id: 1
        headsign: "Union Square (Inbound)"
      - direction_id: 0
        headsign: "Riverside (Outbound)"

